name: perp-prod

networks:
  default:
  shared-services:
    external: true

services:
  db-writer:
    image: ${DOCKERHUB_USERNAME}/perp-db-writer:${IMAGE_TAG:-latest}
    container_name: perp-db-writer
    restart: always
    networks:
      default:
        aliases:
          - perp-db-writer
      shared-services:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MONGODB_URI: ${MONGODB_URI:-}
      KAFKA_BROKERS: "shared-kafka:9092"
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}

  server:
    image: ${DOCKERHUB_USERNAME}/perp-server:${IMAGE_TAG:-latest}
    container_name: perp-server
    restart: always
    ports:
      - "3000:3000"
    networks:
      default:
        aliases:
          - perp-server
      shared-services:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MONGODB_URI: ${MONGODB_URI:-}
      KAFKA_BROKERS: "shared-kafka:9092"
      NODE_ENV: "production"
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_JWT_SECRET_KEY: ${JWT_SECRET}
      REFRESH_TOKEN_JWT_SECRET_KEY: ${JWT_SECRET}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}

  ws:
    image: ${DOCKERHUB_USERNAME}/perp-ws:${IMAGE_TAG:-latest}
    container_name: perp-ws
    restart: always
    ports:
      - "7070:7070"
    networks:
      default:
        aliases:
          - perp-ws
    environment:
      WS_PORT: "7070"
      REDIS_URL: ${REDIS_URL}

  mark-price-poller:
    image: ${DOCKERHUB_USERNAME}/perp-mark-price-poller:${IMAGE_TAG:-latest}
    container_name: perp-mark-price-poller
    restart: always
    networks:
      default:
        aliases:
          - perp-mark-price-poller

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/perp-api-gateway:${IMAGE_TAG:-latest}
    container_name: perp-api-gateway
    restart: always
    ports:
      - "80:8080"
    networks:
      default:
        aliases:
          - perp-api-gateway
    depends_on:
      - server
      - ws
    environment:
      API_GATEWAY_PORT: "8080"
      PORT: "3000"
      WS_PORT: "7070"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: "http://perp-server:3000"
      ORDER_SERVICE_URL: "http://perp-server:3000"
      MARKET_SERVICE_URL: "http://perp-server:3000"
      WALLET_SERVICE_URL: "http://perp-server:3000"
      WS_SERVICE_URL: "ws://perp-ws:7070"
      CORS_ORIGINS: ${CORS_ORIGINS}
