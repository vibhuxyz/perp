name: perp-prod
services:
  kafka:
    image: apache/kafka-native:3.9.0
    container_name: perp-kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  redis:
    image: redis:7-alpine
    container_name: perp-redis
    restart: always
    ports:
      - "6379:6379"

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg16
    container_name: perp-timescaledb
    restart: always
    environment:
      POSTGRES_USER: perp
      POSTGRES_PASSWORD: password
      POSTGRES_DB: perp_db
    ports:
      - "5432:5432"
    volumes:
      - prod_timescaledb_data:/var/lib/postgresql/data
      - ./init-timescaledb.sql:/docker-entrypoint-initdb.d/001-timescaledb.sql:ro
      - ./init-schema.sql:/docker-entrypoint-initdb.d/002-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perp -d perp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.engine
    container_name: perp-engine
    restart: always
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379"
      WAL_PATH: "/data/engine.wal"
    volumes:
      - engine_wal_data:/data

  db-writer:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.db-writer
    container_name: perp-db-writer
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://perp:password@timescaledb:5432/perp_db"
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379"

  server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: perp-server
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://perp:password@timescaledb:5432/perp_db"
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"

  ws:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ws
    container_name: perp-ws
    restart: always
    ports:
      - "7070:7070"
    environment:
      WS_PORT: "7070"

  mark-price-poller:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.mark-price-poller
    container_name: perp-mark-price-poller
    restart: always

  api-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api-gateway
    container_name: perp-api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - server
      - ws
    environment:
      API_GATEWAY_PORT: "8080"
      PORT: "3000"
      WS_PORT: "7070"
      SERVER_URL: "http://server:3000"
      WS_SERVICE_URL: "ws://ws:7070"

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: perp-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  prod_timescaledb_data:
  engine_wal_data:
