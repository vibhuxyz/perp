name: perp
services:
  # apache/kafka-native is a GraalVM-compiled native build of Apache Kafka
  # running in KRaft mode, so it replaces both the old kafka and zookeeper
  # services with one much smaller, faster-starting image.
  kafka:
    image: apache/kafka-native:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9005:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  timescaledb:
    # TimescaleDB is Postgres plus hypertables. Same DATABASE_URL as Postgres.
    # No `latest` tag — pin pg16. Old postgres:15-alpine `pgdata` volumes are
    # incompatible: `docker compose down -v` once, then bring this up.
    image: timescale/timescaledb:2.30.2-pg16
    container_name: timescaledb
    environment:
      POSTGRES_USER: perp
      POSTGRES_PASSWORD: password
      POSTGRES_DB: perp_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-timescaledb.sql:/docker-entrypoint-initdb.d/001-timescaledb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perp -d perp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing to Docker Hub; quay.io is the registry that serves it.
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "abcd"
      MINIO_ROOT_PASSWORD: "abcd2345"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  timescaledb_data:
  minio_data:
