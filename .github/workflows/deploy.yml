name: Deploy Web to S3 & Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Turbo lint, check-types, build
        run: bun x turbo run lint check-types build

      - name: Run Engine Invariant, Solvency & Recovery Tests
        run: |
          for f in apps/engine/tests/test.*.ts; do
            echo "Running test suite: $f"
            bun "$f"
          done

  # -------------------------------------------------------------
  # Web Deployment to AWS S3
  # -------------------------------------------------------------
  deploy-web-s3:
    name: "Deploy: Web to AWS S3"
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check S3 configuration
        id: s3_check
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$S3_BUCKET" ] || [ -z "$AWS_KEY" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "S3_BUCKET_NAME or AWS_ACCESS_KEY_ID not configured. Skipping S3 deployment."
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.s3_check.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        if: steps.s3_check.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      - name: Build Web App with Production Endpoints
        if: steps.s3_check.outputs.enabled == 'true'
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || format('http://{0}', secrets.EC2_HOST_IP || secrets.EC2_HOST) }}
          VITE_WS_URL: ${{ secrets.PROD_WS_URL || format('ws://{0}:7070', secrets.EC2_HOST_IP || secrets.EC2_HOST) }}
        run: |
          cd apps/web
          bun run build

      - name: Configure AWS Credentials
        if: steps.s3_check.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Sync Static Assets to S3
        if: steps.s3_check.outputs.enabled == 'true'
        run: |
          aws s3 sync apps/web/dist s3://${{ secrets.S3_BUCKET_NAME }}/${{ secrets.S3_WEB_PREFIX || 'web' }} --delete

      - name: Invalidate CloudFront Cache (Optional)
        if: steps.s3_check.outputs.enabled == 'true'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          fi

  # -------------------------------------------------------------
  # Individual Visual Build & Push Jobs (One node per image)
  # -------------------------------------------------------------
  build-server:
    name: "Build: perp-server"
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-server:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api-gateway:
    name: "Build: perp-api-gateway"
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api-gateway
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-api-gateway:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ws:
    name: "Build: perp-ws"
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.ws
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-ws:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-ws:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-db-writer:
    name: "Build: perp-db-writer"
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.db-writer
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-db-writer:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-db-writer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mark-price-poller:
    name: "Build: perp-mark-price-poller"
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.mark-price-poller
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-mark-price-poller:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-mark-price-poller:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web-image:
    name: "Build: perp-web"
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-web:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/perp-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Deploy to EC2 (Waits for backend images to finish building)
  # -------------------------------------------------------------
  deploy-ec2:
    name: "Deploy: Containers to EC2"
    needs:
      - build-server
      - build-api-gateway
      - build-ws
      - build-db-writer
      - build-mark-price-poller
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST_IP || secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull Images and Restart on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_HOST: ${{ secrets.EC2_HOST_IP || secrets.EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'prod-perp-jwt-secret-key-32chars-min' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://perp:password@localhost:5432/perp_db' }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || '*' }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET || secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << EOF
            set -e

            # Ensure Docker socket permissions & shared network
            sudo usermod -aG docker \$USER || true
            sudo chmod 666 /var/run/docker.sock 2>/dev/null || true
            sudo docker network create shared-services 2>/dev/null || true

            APP_DIR="/opt/perp"
            sudo mkdir -p \${APP_DIR}
            sudo chown -R \$USER:\$USER \${APP_DIR}

            if [ ! -d "\${APP_DIR}/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git \${APP_DIR}
            fi

            cd \${APP_DIR}
            git fetch --all
            git reset --hard origin/main

            cat << ENVFILE > \${APP_DIR}/.env
            NODE_ENV=production
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            IMAGE_TAG=${IMAGE_TAG}
            JWT_SECRET=${JWT_SECRET}
            ACCESS_TOKEN_JWT_SECRET_KEY=${JWT_SECRET}
            REFRESH_TOKEN_JWT_SECRET_KEY=${JWT_SECRET}
            WS_PORT=7070
            PORT=3000
            API_GATEWAY_PORT=8080
            DATABASE_URL=${DATABASE_URL}
            REDIS_URL=${REDIS_URL}
            MONGODB_URI=${MONGODB_URI}
            KAFKA_BROKERS=shared-kafka:9092
            WAL_PATH=/data/engine.wal
            CORS_ORIGINS=${CORS_ORIGINS}
            S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET}
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            AWS_REGION=${AWS_REGION}
          ENVFILE

            # Copy .env to compose directory so docker compose always finds it
            cp \${APP_DIR}/.env \${APP_DIR}/infrastructure/compose/.env || true

            # Authenticate with Docker Hub
            echo "${DOCKERHUB_TOKEN}" | sudo docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            echo "=== Pulling fresh images from Docker Hub ==="
            sudo docker compose --env-file \${APP_DIR}/.env -f infrastructure/compose/docker-compose.prod.yml pull

            echo "=== Launching updated containers ==="
            sudo docker compose --env-file \${APP_DIR}/.env -f infrastructure/compose/docker-compose.prod.yml up -d --remove-orphans

            echo "=== Deployment Status ==="
            sleep 5
            sudo docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            sudo docker image prune -f
          EOF
