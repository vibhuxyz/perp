name: Deploy Web to S3 & Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Turbo lint, check-types, build
        run: bun x turbo run lint check-types build

      - name: Run Engine Invariant, Solvency & Recovery Tests
        run: |
          for f in apps/engine/tests/test.*.ts; do
            echo "Running test suite: $f"
            bun "$f"
          done

  deploy-web-s3:
    name: Build & Deploy Web to S3
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.S3_BUCKET_NAME != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web App with Production Endpoints
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || format('http://{0}', secrets.EC2_HOST_IP || secrets.EC2_HOST) }}
          VITE_WS_URL: ${{ secrets.PROD_WS_URL || format('ws://{0}:7070', secrets.EC2_HOST_IP || secrets.EC2_HOST) }}
        run: |
          cd apps/web
          bun run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Static Assets to S3
        run: |
          aws s3 sync apps/web/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache (Optional)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

  build-and-push-docker:
    name: Build & Push Images to Docker Hub
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: perp-server
            dockerfile: infrastructure/docker/Dockerfile.server
          - name: perp-api-gateway
            dockerfile: infrastructure/docker/Dockerfile.api-gateway
          - name: perp-ws
            dockerfile: infrastructure/docker/Dockerfile.ws
          - name: perp-db-writer
            dockerfile: infrastructure/docker/Dockerfile.db-writer
          - name: perp-mark-price-poller
            dockerfile: infrastructure/docker/Dockerfile.mark-price-poller
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy Containers to EC2
    needs: [build-and-push-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST_IP || secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Pull Images and Restart on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_HOST: ${{ secrets.EC2_HOST_IP || secrets.EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'prod-perp-jwt-secret-key-32chars-min' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || '*' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh ${EC2_USER}@${EC2_HOST} << EOF
            set -e

            # Ensure shared Docker network exists
            docker network create shared-services 2>/dev/null || true

            APP_DIR="/opt/perp"
            sudo mkdir -p \${APP_DIR}
            sudo chown -R \$USER:\$USER \${APP_DIR}

            if [ ! -d "\${APP_DIR}/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git \${APP_DIR}
            fi

            cd \${APP_DIR}
            git fetch --all
            git reset --hard origin/main

            cat << ENVFILE > \${APP_DIR}/.env
            NODE_ENV=production
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            IMAGE_TAG=${IMAGE_TAG}
            JWT_SECRET=${JWT_SECRET}
            ACCESS_TOKEN_JWT_SECRET_KEY=${JWT_SECRET}
            REFRESH_TOKEN_JWT_SECRET_KEY=${JWT_SECRET}
            WS_PORT=7070
            PORT=3000
            API_GATEWAY_PORT=8080
            DATABASE_URL=${DATABASE_URL}
            REDIS_URL=${REDIS_URL}
            MONGODB_URI=${MONGODB_URI}
            KAFKA_BROKERS=shared-kafka:9092
            WAL_PATH=/data/engine.wal
            CORS_ORIGINS=${CORS_ORIGINS}
          ENVFILE

            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            echo "=== Pulling fresh images from Docker Hub ==="
            docker compose -f infrastructure/compose/docker-compose.prod.yml pull

            echo "=== Launching updated containers ==="
            docker compose -f infrastructure/compose/docker-compose.prod.yml up -d --remove-orphans

            echo "=== Deployment Status ==="
            sleep 5
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            docker image prune -f
          EOF
